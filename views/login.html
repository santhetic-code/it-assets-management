<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ITAM Pro</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Gradien Latar Belakang Abu-abu Gelap (Mewah) */
            background: radial-gradient(circle at top left, #3a3b4c, #1a1a24);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 900px;
            width: 100%;
            background: #1E1E2D; /* Warna area form (Gelap) */
            display: flex;
        }
        .login-left {
            /* Gradien Biru-Ungu Khas ITAM Pro */
            background: linear-gradient(135deg, #4A62FF 0%, #8E44AD 100%);
            padding: 60px 50px;
            color: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-right {
            padding: 60px 50px;
            flex: 1.2;
            color: #FFFFFF;
        }
        .form-control {
            background-color: #151521;
            border: 1px solid #323248;
            color: white;
            padding: 12px 15px;
        }
        .form-control:focus {
            background-color: #151521;
            border-color: #4A62FF;
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #5e6278;
        }
        .btn-login {
            background-color: #3E97FF;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #2b84eb;
            color: white;
            transform: translateY(-2px);
        }
        /* Mengubah warna autofill bawaan browser agar tetap gelap */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #151521 inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center p-3">
    <div class="login-container flex-column flex-md-row">
        
        <!-- Kiri: Area Branding -->
        <div class="login-left">
            <h2 class="fw-bold mb-4" style="letter-spacing: 1px;">
                <i class="bi bi-grid-fill me-2"></i>ITAM Pro.
            </h2>
            <p style="font-size: 0.95rem; line-height: 1.7; opacity: 0.9;">
                Sistem Manajemen Aset IT Terpadu. Kelola infrastruktur jaringan, inventaris, dan kredensial Anda dalam satu brankas digital yang aman.
            </p>
        </div>

        <!-- Kanan: Area Formulir -->
        <div class="login-right">
            <h3 class="fw-bold mb-1">Selamat Datang</h3>
            <p class="mb-4 small" style="color: #5e6278;">Silakan masuk menggunakan akun Anda.</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small" style="color: #a1a5b7;">Username</label>
                    <input type="text" class="form-control rounded-3" id="inpUsername" placeholder="Masukkan username" required autocomplete="username">
                </div>
                
                <div class="mb-4">
                    <label class="form-label small" style="color: #a1a5b7;">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0 rounded-start-3" id="inpPassword" placeholder="••••••••" required autocomplete="current-password">
                        <span class="input-group-text bg-transparent border-start-0 border" style="border-color: #323248; cursor: pointer;" id="togglePassword">
                            <i class="bi bi-eye text-muted"></i>
                        </span>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-login shadow-sm" id="btnSubmit">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Masuk ke Sistem
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // 1. Fitur Toggle Lihat/Sembunyikan Password
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#inpPassword');
    
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    // 2. Logika Pengiriman Data Login (Tembak ke Backend JWT)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Mencegah browser me-refresh halaman
        
        const btn = document.getElementById('btnSubmit');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memvalidasi...';
        btn.disabled = true;

        // Backend FastAPI OAuth2 meminta format 'application/x-www-form-urlencoded' (bukan JSON)
        const formData = new URLSearchParams();
        formData.append('username', document.getElementById('inpUsername').value);
        formData.append('password', document.getElementById('inpPassword').value);

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Akses Diberikan',
                    text: `Selamat datang kembali, ${data.name}!`,
                    timer: 1500,
                    showConfirmButton: false,
                    background: '#1E1E2D', // Sesuaikan warna popup
                    color: '#fff'
                }).then(() => {
                    window.location.href = '/'; // Arahkan ke Halaman Dashboard Utama
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Akses Ditolak',
                    text: data.detail || 'Username atau sandi salah!',
                    background: '#1E1E2D',
                    color: '#fff'
                });
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Server Terputus',
                text: 'Tidak dapat menghubungi server otentikasi.',
                background: '#1E1E2D',
                color: '#fff'
            });
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
