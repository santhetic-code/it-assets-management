<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ITAM Pro</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --itam-cyan: #1DB5E5;
            --itam-blue: #0A6BA8;
            --itam-bg-body: #F0F4F9;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--itam-bg-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0px 8px 24px rgba(10, 107, 168, 0.08);
            max-width: 900px;
            width: 100%;
            background: #FFFFFF;
            display: flex;
        }
        .login-left {
            background-color: #E6F4FA; /* Biru Sangat Muda */
            padding: 60px 50px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 1px solid #e1ebf2;
        }
        .login-right {
            padding: 60px 50px;
            flex: 1.2;
            background: #FFFFFF;
            color: #3f4254;
        }
        .form-control {
            background-color: #ffffff;
            border: 1px solid #e1ebf2;
            color: #3f4254;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: var(--itam-cyan);
            box-shadow: 0 0 0 0.25rem rgba(29, 181, 229, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, var(--itam-cyan), var(--itam-blue));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, var(--itam-blue), var(--itam-cyan));
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(29, 181, 229, 0.4);
            color: white;
        }
        .input-group-text {
            background-color: #ffffff;
            border: 1px solid #e1ebf2;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center p-3">
    <div class="login-container flex-column flex-md-row">
        
        <!-- Kiri: Area Branding dengan Logo Asli -->
        <div class="login-left">
            <img src="/static/img/logo-itam.png" alt="ITAM PRO" style="width: 100%; max-width: 200px; height: auto; object-fit: contain; margin-bottom: 25px;">
            <p class="text-muted fw-medium" style="font-size: 0.95rem; line-height: 1.6;">
                Sistem Manajemen Aset IT Terpadu. Kelola infrastruktur jaringan, inventaris, dan kredensial Anda dalam satu brankas digital yang aman.
            </p>
        </div>

        <!-- Kanan: Area Formulir Bersih -->
        <div class="login-right">
            <h3 class="fw-bold mb-1 text-dark">Selamat Datang</h3>
            <p class="mb-4 small text-muted">Silakan masuk menggunakan akun Anda.</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Username</label>
                    <input type="text" class="form-control rounded-3" id="inpUsername" required autocomplete="username">
                </div>
                
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0 rounded-start-3" id="inpPassword" required autocomplete="current-password">
                        <span class="input-group-text bg-transparent border-start-0 text-muted" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-login shadow-sm" id="btnSubmit">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Masuk ke Sistem
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // 1. Fitur Toggle Lihat/Sembunyikan Password
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#inpPassword');
    
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    // 2. Logika Pengiriman Data Login (Tembak ke Backend JWT)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const btn = document.getElementById('btnSubmit');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memvalidasi...';
        btn.disabled = true;

        const formData = new URLSearchParams();
        formData.append('username', document.getElementById('inpUsername').value);
        formData.append('password', document.getElementById('inpPassword').value);

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Akses Diberikan',
                    text: `Selamat datang kembali, ${data.name}!`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = '/'; // Arahkan ke Dashboard
                });
            } else {
                Swal.fire('Akses Ditolak', data.detail || 'Username atau sandi salah!', 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            Swal.fire('Server Terputus', 'Tidak dapat menghubungi server otentikasi.', 'error');
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
