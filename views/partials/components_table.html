<div class="bg-white rounded-xl shadow-sm border border-gray-200">
    <!-- Header Tabel -->
    <div class="flex justify-between items-center p-6 border-b border-gray-100">
        <h2 class="text-lg font-bold text-gray-800">Tabel Data PC</h2>
        <button hx-get="/ui/components/modal/add" hx-target="#modal-container" class="bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Add Data
        </button>
    </div>

    <!-- Toolbar Controls (FIXED) -->
    <div class="flex flex-none flex-wrap justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50/50 gap-4">
        <div class="flex items-center gap-4 flex-wrap">
            <div class="flex rounded-lg shadow-sm border border-gray-200 overflow-hidden bg-white whitespace-nowrap">
                <button class="px-3 py-1.5 text-xs font-semibold text-green-600 border-r border-gray-200 hover:bg-green-50 flex items-center gap-1.5 transition-colors">Excel</button>
                <button class="px-3 py-1.5 text-xs font-semibold text-red-600 border-r border-gray-200 hover:bg-red-50 flex items-center gap-1.5 transition-colors">PDF</button>
                <button class="px-3 py-1.5 text-xs font-semibold text-gray-600 hover:bg-gray-50 flex items-center gap-1.5 transition-colors">Print</button>
            </div>

            <select name="type_filter" hx-get="/ui/components/table" hx-target="#table-container" hx-trigger="change" class="text-sm border-gray-200 rounded-lg text-gray-700 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1.5 pl-3 pr-8 min-w-[150px]">
                <option value="">Filter Kategori</option>
                <option value="Operasional">PC Operasional</option>
                <option value="Server">PC Server</option>
                <option value="Backup">PC Backup</option>
            </select>

            <div class="flex items-center gap-2 text-sm text-gray-600 whitespace-nowrap">
                <span>Show</span>
                <select class="border-gray-200 rounded-md py-1 px-2 text-sm shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option>10</option>
                    <option>25</option>
                    <option>50</option>
                </select>
                <span>entries</span>
            </div>
        </div>

        <div class="flex items-center gap-2 whitespace-nowrap mt-4 sm:mt-0">
            <label class="text-sm text-gray-600 font-medium">Search:</label>
            <input type="text" name="search" hx-get="/ui/components/table" hx-trigger="keyup changed delay:300ms" hx-target="#table-container" placeholder="Cari Spesifikasi..." class="px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500 shadow-sm w-full sm:w-64">
        </div>
    </div>

    <!-- Data Table -->
    <div class="p-6 overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-[#dbeafe] text-[#1e3a8a] text-[11px] uppercase tracking-wider">
                    <th class="py-3.5 px-4 font-bold rounded-tl-lg">Identitas PC</th>
                    <th class="py-3.5 px-4 font-bold">Processor PC</th>
                    <th class="py-3.5 px-4 font-bold">RAM</th>
                    <th class="py-3.5 px-4 font-bold">Penyimpanan</th>
                    <th class="py-3.5 px-4 font-bold">Mainboard</th>
                    <th class="py-3.5 px-4 font-bold">Kategori</th>
                    <th class="py-3.5 px-4 font-bold text-center rounded-tr-lg">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-100 text-sm text-gray-700">
                <!-- Data akan disuntik di sini oleh Jinja nantinya -->
            </tbody>
        </table>
    </div>
</div>
