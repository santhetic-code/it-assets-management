<div id="modal-backdrop" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 flex items-center justify-center overflow-y-auto opacity-0 animate-[fadeIn_0.2s_ease-out_forwards]">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl my-8 mx-4 flex flex-col max-h-[90vh] scale-95 animate-[scaleUp_0.2s_ease-out_forwards]">
        
        <!-- Header Modal -->
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-2xl">
            <div>
                <h2 class="text-lg font-bold text-gray-800 tracking-tight">Registrasi Spesifikasi PC Baru</h2>
                <p class="text-xs text-gray-500 mt-0.5">Konfigurasi perangkat keras menggunakan input teks manual murni.</p>
            </div>
            <!-- Tombol Close -->
            <button onclick="document.getElementById('modal-backdrop').remove()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Form Registrasi -->
        <form hx-post="/ui/components/create" hx-target="#table-container" hx-swap="innerHTML" autocomplete="off" class="flex-1 overflow-y-auto custom-scrollbar">
            
            <div class="p-6 space-y-8">
                
                <!-- SECTION 1: Identitas PC -->
                <div class="space-y-4">
                    <div class="flex items-center gap-3 border-b border-gray-100 pb-2">
                        <span class="flex items-center justify-center w-5 h-5 rounded bg-itam-50 text-itam-700 text-xs font-bold">1</span>
                        <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Identitas & Kategori</h3>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-5">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Identitas / Nama PC <span class="text-red-500">*</span></label>
                            <input type="text" name="name" required autocomplete="off" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Kategori PC <span class="text-red-500">*</span></label>
                            <select name="pc_type" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white cursor-pointer">
                                <option value="Operasional">PC Operasional</option>
                                <option value="Server">PC Server</option>
                                <option value="Backup">PC Backup</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2: Komponen Teras (Manual Input) -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                        <div class="flex items-center gap-3">
                            <span class="flex items-center justify-center w-5 h-5 rounded bg-itam-50 text-itam-700 text-xs font-bold">2</span>
                            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Spesifikasi Hardware</h3>
                        </div>
                        <span class="text-[10px] font-semibold text-gray-400 bg-gray-100 px-2 py-0.5 rounded">Input Manual Text</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Processor (CPU)</label>
                            <input type="text" name="processor_spec" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Kapasitas RAM</label>
                            <input type="text" name="ram_spec" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Penyimpanan (Storage)</label>
                            <input type="text" name="storage_spec" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Motherboard / Mainboard</label>
                            <input type="text" name="mainboard_spec" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Kartu Grafis (VGA/GPU)</label>
                            <input type="text" name="vga_spec" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Sistem Operasi (OS)</label>
                            <input type="text" name="os_name" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Monitor Display</label>
                            <input type="text" name="monitor" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                    </div>
                </div>

                <!-- SECTION 3: Periferal Eksternal -->
                <div class="space-y-4">
                    <div class="flex items-center gap-3 border-b border-gray-100 pb-2">
                        <span class="flex items-center justify-center w-5 h-5 rounded bg-itam-50 text-itam-700 text-xs font-bold">3</span>
                        <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Periferal Eksternal</h3>
                    </div>
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Keyboard</label>
                            <input type="text" name="keyboard" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Mouse</label>
                            <input type="text" name="mouse" autocomplete="off" spellcheck="false" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-itam-500 focus:border-itam-500 outline-none transition-all shadow-sm bg-gray-50 focus:bg-white">
                        </div>
                    </div>
                </div>
                
            </div>

            <!-- Footer Modal & Submit -->
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/80 rounded-b-2xl flex justify-end gap-3 sticky bottom-0">
                <button type="button" onclick="document.getElementById('modal-backdrop').remove()" class="px-5 py-2 text-sm font-semibold text-gray-600 hover:text-gray-800 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors shadow-sm">
                    Batal
                </button>
                <button type="submit" onclick="setTimeout(() => document.getElementById('modal-backdrop').remove(), 200)" class="px-5 py-2 text-sm font-semibold text-white bg-cyan-500 hover:bg-cyan-600 rounded-lg transition-colors shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Simpan Spesifikasi
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Animasi Modal -->
<style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleUp { from { transform: scale(0.95); } to { transform: scale(1); } }
</style>
