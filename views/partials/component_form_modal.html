<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    .modal-font { 
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    
    /* Apple-like Hover & Focus Ring */
    .apple-input {
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform-origin: center;
        outline: none !important; /* Fix brutal untuk menghilangkan border hitam bawaan browser */
    }
    
    .apple-input:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 24px rgba(8, 145, 178, 0.12); 
        border-color: #0891B2;
    }
    
    .apple-input:focus { 
        box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.2) !important; 
        border-color: #0891B2 !important; 
        background-color: #ffffff;
        transform: scale(1.02);
    }
    
    /* Entry Animations */
    @keyframes modalEntry { 
        from { opacity: 0; transform: scale(0.95) translateY(15px); } 
        to { opacity: 1; transform: scale(1) translateY(0); } 
    }
    @keyframes backdropEntry {
        from { opacity: 0; } to { opacity: 1; }
    }

    /* Exit Animations */
    @keyframes modalExit { 
        from { opacity: 1; transform: scale(1) translateY(0); } 
        to { opacity: 0; transform: scale(0.95) translateY(15px); } 
    }
    @keyframes backdropExit {
        from { opacity: 1; } to { opacity: 0; }
    }

    .animate-modal-exit {
        animation: modalExit 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.9) forwards !important;
    }
    .animate-backdrop-exit {
        animation: backdropExit 0.3s ease-out forwards !important;
    }
</style>

<div id="modal-backdrop" class="modal-font fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 sm:p-6 opacity-0 animate-[backdropEntry_0.3s_ease-out_forwards]">
    <!-- Modal Container: Diperlebar ke max-w-4xl agar sangat lega untuk data panjang -->
    <div id="modal-content" class="bg-white rounded-[28px] shadow-2xl ring-1 ring-slate-900/10 w-full max-w-4xl flex flex-col max-h-[90vh] overflow-hidden animate-[modalEntry_0.4s_cubic-bezier(0.1,0.76,0.55,0.9)_forwards] relative">

        <!-- PANEL TUNGGAL: FORMULIR -->
        <div class="flex-1 flex flex-col min-w-0 bg-gradient-to-br from-slate-50 via-cyan-50/60 to-cyan-200/40 relative">
            
            <!-- Header -->
            <div class="px-8 pt-8 pb-5 flex justify-between items-start shrink-0">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-[16px] bg-white text-cyan-600 flex items-center justify-center shrink-0 shadow-sm border border-cyan-100/50">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="3"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
                    </div>
                    <div>
                        <h2 class="text-[24px] font-bold text-slate-800 tracking-tight leading-tight flex items-center gap-3">
                            {% if is_edit %}Edit Spesifikasi PC{% else %}Registrasi PC Baru{% endif %}
                            {% if is_edit %}
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider bg-amber-100 text-amber-700">Edit Mode</span>
                            {% endif %}
                        </h2>
                        <p class="text-[14px] text-slate-500 mt-1.5 font-medium">Lengkapi parameter teknis aset di bawah ini.</p>
                    </div>
                </div>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-700 hover:bg-white/60 p-2.5 rounded-full transition-colors z-50">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Body Form -->
            <form id="pc-form"
                  hx-post="{% if is_edit %}/ui/components/{{ component.id }}/update{% else %}/ui/components/create{% endif %}"
                  hx-target="#table-container"
                  hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) closeModal();"
                  class="flex-1 flex flex-col overflow-hidden">

                <div class="flex-1 overflow-y-auto px-8 pb-8 space-y-6 custom-scrollbar">
                    
                    <!-- Section 1: Identitas -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="sm:col-span-1">
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Nama PC / Identifier <span class="text-red-500">*</span></label>
                            <input type="text" name="name" required autocomplete="off" value="{{ component.name or '' }}" class="apple-input w-full px-4 h-[48px] bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm">
                        </div>
                        <div class="sm:col-span-1">
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Peruntukan <span class="text-red-500">*</span></label>
                            <select name="pc_type" required class="apple-input w-full px-4 h-[48px] bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 cursor-pointer appearance-none shadow-sm">
                                <option value="Operasional" {% if component and component.pc_type == 'Operasional' %}selected{% endif %}>Operasional</option>
                                <option value="Server" {% if component and component.pc_type == 'Server' %}selected{% endif %}>Server</option>
                                <option value="Backup" {% if component and component.pc_type == 'Backup' %}selected{% endif %}>Backup</option>
                            </select>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="h-px w-full bg-slate-200/50"></div>

                    <!-- Section 2: Komponen Inti (Menggunakan Textarea agar teks wrap otomatis) -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- CPU -->
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Processor (CPU)</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
                                <textarea name="processor_spec" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.processor_spec or '' }}</textarea>
                            </div>
                        </div>
                        <!-- RAM -->
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Memori (RAM)</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20M6 12v4M10 12v4M14 12v4M18 12v4"/></svg>
                                <textarea name="ram_spec" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.ram_spec or '' }}</textarea>
                            </div>
                        </div>
                        <!-- Storage -->
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Penyimpanan</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
                                <textarea name="storage_spec" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.storage_spec or '' }}</textarea>
                            </div>
                        </div>
                        <!-- Mainboard -->
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Mainboard</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M14 9V5M10 9V5M14 19v-4M10 19v-4M5 14H9M5 10H9M19 14h-4M19 10h-4"/><circle cx="12" cy="12" r="2"/></svg>
                                <textarea name="mainboard_spec" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.mainboard_spec or '' }}</textarea>
                            </div>
                        </div>
                        <!-- VGA -->
                        <div class="sm:col-span-2">
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Kartu Grafis (VGA)</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                                <textarea name="vga_spec" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.vga_spec or '' }}</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="h-px w-full bg-slate-200/50"></div>

                    <!-- Section 3: Layar & OS -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Monitor</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                <textarea name="monitor" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.monitor or '' }}</textarea>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Sistem Operasi</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                                <textarea name="os_name" rows="2" autocomplete="off" spellcheck="false" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.os_name or '' }}</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="h-px w-full bg-slate-200/50"></div>

                    <!-- Section 4: Periferal Input -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Keyboard</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"/><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"/></svg>
                                <textarea name="keyboard" rows="2" autocomplete="off" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.keyboard or '' }}</textarea>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] font-semibold text-slate-600 mb-2">Mouse</label>
                            <div class="relative">
                                <svg class="w-4 h-4 absolute left-4 top-[15px] text-slate-400 z-10 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="7"/><path d="M12 2v8"/></svg>
                                <textarea name="mouse" rows="2" autocomplete="off" class="apple-input pl-11 pr-4 py-3 h-[64px] w-full bg-white border border-slate-200/80 rounded-[12px] text-[14px] font-medium text-slate-800 shadow-sm relative resize-none custom-scrollbar leading-snug">{{ component.mouse or '' }}</textarea>
                            </div>
                        </div>
                    </div>

                    {% if is_edit %}
                    <div class="mt-8">
                        <label class="block text-[13px] font-bold text-amber-700 mb-2">Alasan Pembaruan <span class="text-amber-500">*</span></label>
                        <textarea name="update_reason" rows="2" required class="apple-input w-full px-5 py-3.5 border border-amber-300 rounded-[12px] text-[14px] font-medium outline-none shadow-sm bg-amber-50/70 resize-none text-slate-800"></textarea>
                    </div>
                    {% endif %}

                </div>

                <!-- Footer / Actions -->
                <div class="px-8 py-5 bg-white/70 backdrop-blur-xl border-t border-slate-200/60 flex flex-col sm:flex-row justify-end items-center gap-4">
                    <button type="button" onclick="closeModal()" class="w-full sm:w-auto px-8 h-[48px] text-[14px] font-bold text-slate-600 hover:text-slate-900 bg-white border border-slate-200 rounded-[14px] hover:bg-slate-50 transition-colors shadow-sm">
                        Batal
                    </button>
                    <button type="submit" class="w-full sm:w-auto px-8 h-[48px] text-[14px] font-bold text-white bg-slate-900 hover:bg-slate-800 active:scale-[0.98] rounded-[14px] transition-all shadow-md flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        {% if is_edit %}Simpan Perubahan{% else %}Simpan Spesifikasi{% endif %}
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

<script>
    // Fungsi untuk animasi exit modal
    function closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        const modal = document.getElementById('modal-content');
        
        backdrop.classList.add('animate-backdrop-exit');
        modal.classList.add('animate-modal-exit');
        
        setTimeout(() => {
            backdrop.remove();
        }, 300);
    }
</script>
